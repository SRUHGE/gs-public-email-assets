<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unsubscribe | Guided Startup (Test)</title><style>body{font:17px/1.6 Arial,sans-serif;background:#f1f6fc;color:#18375c;margin:0}.box{max-width:560px;margin:10vh auto;background:white;padding:0 36px 36px;border-top:6px solid #e7a523;box-shadow:0 5px 25px #14335915}h1{margin-top:0}.brand-header{display:block;width:100%;height:auto;margin:24px auto 26px}button{padding:13px 23px;background:#174a8a;color:white;border:0;border-radius:4px;font-size:16px;cursor:pointer}button:disabled{opacity:.6}small{color:#64748b}</style></head><body><main class="box"><img class="brand-header" src="email/GS_Approved_Email_Images_For_GitHub/email/assets/header-updated-logo.jpg" alt="Guided Startup branded header"><h1>Unsubscribe from updates</h1><p>Would you like to stop receiving optional Guided Startup early-access emails?</p><button id="confirm">Confirm unsubscribe</button><p id="status" role="status" aria-live="polite"></p><p>Need assistance? <a href="mailto:support@guidedstartup.com">support@guidedstartup.com</a></p></main><script>
const button=document.getElementById('confirm'),status=document.getElementById('status');
button.addEventListener('click',async()=>{
 const token=new URLSearchParams(location.search).get('token');
 if(!token){status.textContent='This unsubscribe link is incomplete. Please contact support.';return;}
 button.disabled=true;status.textContent='Processing your request…';
 try{
  const response=await fetch('https://guidedstartup-pathb-auth-test.onrender.com/api/early-access/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
  const result=await response.json();
  if(!response.ok||!result.success)throw new Error('Unable to complete request');
  status.textContent='You have been unsubscribed from optional early-access updates.';
  button.hidden=true;history.replaceState(null,'',location.pathname);
 }catch(_){status.textContent='We could not complete your request. Please try again or email support.';button.disabled=false;}
});</script></body></html>
